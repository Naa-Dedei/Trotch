# Supabase CLI configuration for local development (`supabase start`).
# Only settings Trotch relies on are listed; everything else uses CLI defaults.
project_id = "trotch"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 5000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "trotch://"
# Deep links the app uses for email confirmation, OAuth and password reset.
# exp:// entries allow testing in Expo Go; remove them for production.
additional_redirect_urls = [
  "trotch://auth/callback",
  "trotch://auth/reset-password",
  "exp://**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false
